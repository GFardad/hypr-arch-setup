# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/Blazer.conf   # JaKooLit theme (optional; install.sh keeps this line only if present)
include themes/dracula.conf
include themes/diff.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

linux_display_server auto
scrollback_lines 5000
wheel_scroll_min_lines 1

enable_audio_bell no
window_padding_width 4

selection_foreground none
selection_background none
allow_remote_control yes

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrolling & Search
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# Animations
cursor_blink yes
cursor_shape block
window_transition 0.15
visual_bell yes
visual_feedback yes
cursor_trail 10
cursor_trail_decay 0.2 0.9
cursor_trail_start_threshold 0

# Enable clipboard access


# Reliable paste from selection using kitten clipboard


# Wayland clipboard configuration
wayland_enable_primary_selection yes

# Don't restore the last window size/state on start (0.49.x also remembers
# "maximized" and reopens maximized, which fights the tiling WM)
remember_window_size no


# Immediate paste from selection solution
map ctrl+shift+s launch --type=overlay --stdin-source=@selection kitty-paste-selection

# --- WhatHappened? (wh) — capture the last command and its output ---
# Give kitty a control socket so `wh save` can reach the window (from a
# keybinding or another process); kitty exports it as $KITTY_LISTEN_ON.
listen_on unix:@wh-{kitty_pid}
# Press this right after a command to save that command + its output.
# (ctrl+shift+s was already taken by kitty-paste-selection.)
map ctrl+shift+y launch --type=background wh save
# --- end WhatHappened? ---
