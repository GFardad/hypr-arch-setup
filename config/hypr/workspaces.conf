# Workspace rules
# NOTE: Basic workspace settings restored
#
# Bound by EDID description, not by connector name: on this two-GPU box the
# kernel's connector names shuffle between boots (see monitors.conf header), so
# a name-based rule silently lands the workspace on the wrong physical panel.
#   1,2 -> ASUS PG32UCDM (4K240, main)   3 -> GDM-275LN (1080p75)   4 -> GDM-225JN (1080p60)
workspace = 1, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T4LMQS021303
workspace = 2, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T4LMQS021303
workspace = 3, monitor:desc:ChangHong Electric Co.Ltd GDM-275LN 0000000000001
workspace = 4, monitor:desc:ChangHong Electric Co.Ltd GDM-225JN 0000000000001
