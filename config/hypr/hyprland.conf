# Always refer to Hyprland wiki

# Initial boot script enable to apply initial wallpapers, theming, new settings etc.
# https://wiki.hyprland.org/
# suggest not to change this or delete this including deleting referrence file in ~/.config/hypr/.initial_startup_done
# as long as the referrence file is present, this initial-boot.sh will not execute
# monitor=,preferred,auto,1

exec-once = $HOME/.config/hypr/initial-boot.sh
# Sunshine virtual monitor: persistent headless output with EXPLICIT name "SUNSHINE".
# Geometry lives in ~/.config/hypr/monitors.conf (monitor=SUNSHINE,... line).
# NOTE: panels are matched by EDID description, because the kernel's connector names shuffle
#       between boots on this two-GPU box (see DISPLAY_4K240_RUNBOOK.md §1). Never edit
#       monitors.conf with nwg-displays unless its "Use description" toggle is ON — with it off,
#       Apply writes name-based rules and misplaces panels (see the runbook).
exec-once = hyprctl output create headless SUNSHINE; $HOME/.config/hypr/scripts/wallpaper.sh
# Self-heal: watch Hyprland's socket2 monitor events and re-run wallpaper.sh once
# the layout settles. Without this, anything that changes the monitor set after
# boot (Sunshine enable/disable, hotplug, SUNSHINE recreated) leaves the
# wallpapers stale, and they stay that way until something re-runs the script.
exec-once = $HOME/.config/hypr/scripts/wallpaper-watch.sh
# Crash guard: if mpvpaper dies while an eligible output is enabled, restart it
# within ~45s. Complements the watcher (monitor events) with a plain liveness
# check, so a crash is recovered even when no monitor event fires.
exec-once = $HOME/.config/hypr/scripts/wallpaper-guard.sh
exec-once = ags

### Sourcing external config files ###
$configs = $HOME/.config/hypr/configs # Default Configs directory path
$UserConfigs = $HOME/.config/hypr/UserConfigs # User Configs directory path

source=$configs/Keybinds.conf # Pre-configured keybinds

# Load defaults, then user additions/overrides

source= $configs/ENVariables.conf # Environment variables (defaults)
source= $UserConfigs/ENVariables.conf # Environment variables (user)

# Load defaults, then user additions
source= $configs/WindowRules.conf # Window Rules and Layer Rules (defaults)
source= $UserConfigs/WindowRules.conf # Window Rules and Layer Rules (user)

source= $configs/SystemSettings.conf # Default config for hypr

source= $UserConfigs/UserDecorations.conf # Decorations config file
source= $UserConfigs/UserAnimations.conf # Animation config file


source= $UserConfigs/UserKeybinds.conf # Put your own keybinds here
source= $UserConfigs/UserSettings.conf # Main Hyprland Settings.
source= $UserConfigs/01-UserDefaults.conf # settings for User defaults apps
source= $UserConfigs/UserStartup.conf # User autostart (exec-once lines; sourced once)

# Monitor + workspace rules — EDID-description based (see DISPLAY_4K240_RUNBOOK.md §1)
source= $HOME/.config/hypr/monitors.conf
source= $HOME/.config/hypr/workspaces.conf
source= $configs/Startup_Apps.conf


# جلوگیری از فول‌اسکرین خودکار در Zen Browser
windowrule {
    name = suppress-zen-fullscreen
    match:class = zen
    suppress_event = fullscreen
    suppress_event = maximize
}

# برای غلبه تِیرینگ در بازی‌ها، به‌خصوص Minecraft
windowrule = match:class java, immediate on
windowrule = match:title .*(Minecraft).*, immediate on

env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct
env = EGL_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland
# env = GBM_BACKEND,nvidia-drm  # REMOVED: causes Firefox/Wayland crashes (Hyprland wiki)
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# WLR_NO_HARDWARE_CURSORS removed: wlroots-era env var, ignored by Hyprland (aquamarine).
# Real knob: cursor:no_hardware_cursors = 2 in configs/SystemSettings.conf (live-verified).
env = MOZ_DISABLE_RDD_SANDBOX,1

# env = __GL_MaxFramesAllowed,1
env = __GL_SYNC_TO_VBLANK,0
# env = AQ_NO_MODIFIERS,1

exec-once = gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Classic
exec-once = gsettings set org.gnome.desktop.interface cursor-size 16
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,16

