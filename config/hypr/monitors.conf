# Monitor layout — matched by EDID DESCRIPTION, never by connector name.
#
# WHY: the kernel numbers DRM connectors from a system-wide counter in
# driver-registration order, and this box has two GPUs (Intel iGPU + NVIDIA).
# When Intel registers first the panels are DP-2 / DP-3 / HDMI-A-5; when NVIDIA
# registers first the very same panels are DP-1 / DP-2 / HDMI-A-2. The connector
# NAME is therefore not an identity here — the EDID description is, and it never
# changes. See DISPLAY_4K240_RUNBOOK.md § "Connector names are not stable".
#
# NOTE: nwg-displays rewrites this file from the CURRENT live names and would
# reintroduce the name dependence — do not use it to edit this layout.
#
# Layout (one bottom-aligned row):
#   GDM-225JN (1080p60, HDMI) | ASUS PG32UCDM (4K240, main) | GDM-275LN (1080p75, DP)
# bitdepth,10 is required for the 4K panel: without it the 3840x2160@240.02
# mode fails Hyprland's atomic test and the panel falls back to 120/60 Hz.
monitor=desc:ASUSTek COMPUTER INC PG32UCDM T4LMQS021303,3840x2160@240.02,1920x1080,1,bitdepth,10,vrr,0
monitor=desc:ChangHong Electric Co.Ltd GDM-225JN 0000000000001,1920x1080@60.0,0x2160,1,vrr,0
monitor=desc:ChangHong Electric Co.Ltd GDM-275LN 0000000000001,1920x1080@75.0,5760x2160,1,vrr,0
monitor=SUNSHINE,disable
