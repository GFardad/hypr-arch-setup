# /* ---- User autostart (sourced exactly once from hyprland.conf) ---- */
# NOTE: put exec-once lines HERE, not in 01-UserDefaults.conf —
# that file is sourced twice (hyprland.conf + configs/Keybinds.conf),
# so any exec-once inside it runs twice per session.

# cursor-clip: clipboard monitor daemon (backend for the cursor-clip overlay;
# binds in UserConfigs/UserKeybinds.conf: Super+Alt+V / Super+V)
# ~/.local/bin/cursor-clip is a locally patched v1.0.2 build:
#  - releases the full-screen capture layer once the overlay opens
#    (clicks pass through to windows underneath)
#  - source: ~/.local/src/cursor-clip, patch: ~/.local/src/cursor-clip-click-through.patch
exec-once = /home/gfardad/.local/bin/cursor-clip --daemon

# Warm PyCharm so `pycharm <file>` opens in <2s (skips when RAM low).
# Keep-alive script: ~/.local/bin/pycharm-keepalive.sh (comm-based JVM detection,
# only warms when >=4GB MemAvailable). Logs: journalctl --user -t pycharm-keepalive.
exec-once = /home/gfardad/.local/bin/pycharm-keepalive.sh

# Hide PyCharm's no-project/Welcome window while keeping the JVM resident, so that
# closing the last light-edit tab does NOT open the home page (user's requested
# behaviour: "stay alive but hide the window"). Watcher: ~/.local/bin/pycharm-window-watch.py
# (idempotent; self-locks so the systemd unit pycharm-window-watch.service does not double it).
# Logs: journalctl --user -t pycharm-window-watch.
exec-once = /usr/bin/python3 /home/gfardad/.local/bin/pycharm-window-watch.py
