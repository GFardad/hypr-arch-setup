# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Clean dwindle: apps request maximize/fullscreen when they open (kitty remembers
# a "maximized" state in ~/.cache/kitty/main.json, VSCode restores session state,
# etc.) which makes them open "semi-fullscreen" and push the other tiles away.
# Suppress those auto-requests for all apps. Manual keybinds (Super+Ctrl+F,
# Super+Shift+F) still work - they don't go through the app's xdg request.
windowrule {
    name = suppress-auto-maximize-fullscreen
    match:class = ^(.*)$
    suppress_event = maximize
    suppress_event = fullscreen
}
