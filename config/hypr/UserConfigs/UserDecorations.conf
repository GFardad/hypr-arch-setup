# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  gaps_in = 7
  gaps_out = 14 # synced with live session values (was 8/16 on disk, 7/14 at runtime)
  allow_tearing = true
  col.active_border = $color12
  col.inactive_border = $color10
}

decoration {
  rounding = 8
  active_opacity = 0.95
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 1
    render_power = 2

    color =  $color12
    color_inactive = $color10
  }


  blur {
    enabled = true
    size = 18
    passes = 3
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
