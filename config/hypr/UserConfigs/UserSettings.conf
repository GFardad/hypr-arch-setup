# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

# --- User overrides ---
# The vendor default (configs/SystemSettings.conf:94) sets on_focus_under_fullscreen = 1
# ("take_over"): when a workspace has a fullscreen/maximized window, the NEXT window
# opened on that workspace steals that state -> it opens "semi-fullscreen" and the old
# window gets pushed back into the tiles. Set to 2 (exit_fullscreen, upstream default):
# the fullscreen window exits fullscreen instead, the new window stays a normal tile.
misc {
  on_focus_under_fullscreen = 2
}

